<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#283520" />
    <title>Minecraft Workshop</title>
    <link rel="stylesheet" href="./style.css?v=12" />
    <script defer src="./app.js?v=12"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="./"
        ><span class="creeper" aria-hidden="true"></span
        ><span>MINECRAFT</span></a
      >
      <div class="player-stats">
        <span title="Experience"
          ><b class="xp-icon">✦</b> <strong id="experience">—</strong
          ><small>XP</small></span
        >
      </div>
      <div class="connection">
        <button
          id="refresh"
          class="square"
          title="Refresh"
          aria-label="Refresh"
        >
          ↻
        </button>
      </div>
    </header>
    <main>
      <section class="hero">
        <div><h1>Craft. Enchant. Explore.</h1></div>
        <div class="hero-block" aria-hidden="true">
          <div class="cube"><i></i><b></b><em></em></div>
        </div>
      </section>
      <div class="workspace">
        <div class="main-column">
          <nav class="tabs" aria-label="Stations">
            <button class="tab active" data-tab="armor">Armor</button
            ><button class="tab" data-tab="tools">Tools</button
            ><button class="tab" data-tab="enchant">Enchanting</button
            ><button class="tab" data-tab="brew">Potions</button
            ><button class="tab" data-tab="anvil">Anvil</button>
          </nav>
          <section id="armor-panel" class="panel tab-panel">
            <div class="panel-title">
              <div>
                <span class="kicker">CRAFTING TABLE</span>
                <h2>Armor</h2>
              </div>
              <svg class="station-icon" aria-hidden="true">
                <use href="./assets/items.svg#workbench"></use>
              </svg>
            </div>
            <form id="armor-form">
              <label
                >Material<select id="armor-material" required></select
              ></label>
              <div id="armor-options" class="craft-grid"></div>
              <div class="craft-footer">
                <div>
                  <span class="subtle">Cost</span>
                  <div id="armor-cost" class="chips"></div>
                </div>
                <button class="primary" type="submit">Craft armor</button>
              </div>
            </form>
          </section>
          <section id="tools-panel" class="panel tab-panel" hidden>
            <div class="panel-title">
              <div>
                <span class="kicker">CRAFTING TABLE</span>
                <h2>Tools</h2>
              </div>
              <svg class="station-icon" aria-hidden="true">
                <use href="./assets/items.svg#pickaxe"></use>
              </svg>
            </div>
            <form id="tools-form">
              <label
                >Material<select id="tool-material" required></select
              ></label>
              <div id="tool-options" class="craft-grid tools-grid"></div>
              <div class="craft-footer">
                <div>
                  <span class="subtle">Cost</span>
                  <div id="tool-cost" class="chips"></div>
                </div>
                <button class="primary" type="submit">Craft tool</button>
              </div>
            </form>
          </section>
          <section id="enchant-panel" class="panel tab-panel" hidden>
            <div class="panel-title">
              <div>
                <span class="kicker">ENCHANTING TABLE</span>
                <h2>Enchant an item</h2>
              </div>
              <svg class="station-icon" aria-hidden="true">
                <use href="./assets/items.svg#enchanting"></use>
              </svg>
            </div>
            <form id="enchant-form">
              <label>Item<select id="enchant-item" required></select></label>
              <div class="form-row">
                <label
                  >Enchantment<select id="enchantment" required></select></label
                ><label
                  >Level<select id="enchant-level" required></select
                ></label>
              </div>
              <div id="enchant-hint" class="recipe-note"></div>
              <div class="actions">
                <button type="button" class="secondary" id="enchant-preview">
                  Cost</button
                ><button type="submit" class="primary">Enchant</button>
              </div>
            </form>
            <div id="enchant-result" class="preview" hidden></div>
          </section>
          <section id="brew-panel" class="panel tab-panel" hidden>
            <div class="panel-title">
              <div>
                <span class="kicker">BREWING STAND</span>
                <h2>Brew a potion</h2>
              </div>
              <svg class="station-icon" aria-hidden="true">
                <use href="./assets/items.svg#potion"></use>
              </svg>
            </div>
            <form id="brew-form">
              <div id="potion-options" class="craft-grid tools-grid"></div>
              <label
                >Modifier<select id="brew-modifier" required></select
              ></label>
              <div class="actions">
                <button type="button" class="secondary" id="brew-preview">
                  Ingredients</button
                ><button type="submit" class="primary">Brew potion</button>
              </div>
            </form>
            <div id="brew-result" class="preview" hidden></div>
          </section>
          <section id="anvil-panel" class="panel tab-panel" hidden>
            <div class="panel-title">
              <div>
                <span class="kicker">ANVIL</span>
                <h2>Repair & combine</h2>
              </div>
              <svg class="station-icon" aria-hidden="true">
                <use href="./assets/items.svg#anvil"></use>
              </svg>
            </div>
            <form id="anvil-form">
              <div class="anvil-slots">
                <span class="slot-decoration">1</span
                ><label
                  >Target item<select id="anvil-item" required></select
                ></label>
              </div>
              <div class="form-row">
                <label
                  >Operation<select id="anvil-mode">
                    <option value="material">Repair with material</option>
                    <option value="combine">Combine item or book</option>
                    <option value="rename">Rename only</option>
                  </select></label
                ><label id="material-field"
                  >Units<input
                    id="anvil-units"
                    type="number"
                    value="1"
                    min="1"
                    max="64"
                /></label>
              </div>
              <label id="sacrifice-field" hidden
                >Second item / book<select id="anvil-sacrifice"></select></label
              ><label
                >New name <span class="subtle">/ optional</span
                ><input
                  id="anvil-name"
                  type="text"
                  maxlength="50"
                  placeholder="e.g. Trusty Pickaxe"
                  autocomplete="off"
              /></label>
              <div class="actions">
                <button type="button" class="secondary" id="anvil-preview">
                  Preview</button
                ><button type="submit" class="primary">Apply</button>
              </div>
            </form>
            <div id="anvil-result" class="preview" hidden></div>
          </section>
          <section class="status-panel" aria-label="Action result">
            <div id="status" role="status" aria-live="polite">
              Loading workshop…
            </div>
            <div id="changes" class="changes"></div>
          </section>
          <section class="panel resource-panel">
            <div class="section-head">
              <h2>Resources</h2>
              <span class="subtle">YOUR SUPPLIES</span>
            </div>
            <div id="resources" class="resource-grid"></div>
          </section>
        </div>
        <aside>
          <section class="panel inventory-panel">
            <div class="section-head">
              <h2>Inventory</h2>
              <span id="item-count" class="counter">0</span>
            </div>
            <div id="effects" class="effects"></div>
            <div id="inventory" class="inventory">
              <p class="subtle">Loading…</p>
            </div>
            <button id="reset" class="text-button">Start over</button>
          </section>
        </aside>
      </div>
    </main>
    <footer>
      <span>MINECRAFT WORKSHOP</span><span>READY FOR ADVENTURE</span>
    </footer>
  </body>
</html>
