<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory Method - Equipment Crafter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --mc-font: 'Press Start 2P', monospace;
            --mc-bg: #121212;
            --mc-card-bg: #1f1f1f;
            --mc-card-border: #333333;
            --mc-accent: #e39162;
            --mc-enchant: #aa00aa; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--mc-bg);
            color: #fff;
            font-family: var(--mc-font);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto 30px auto;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
        }

        .btn-back {
            background-color: #333;
            color: #fff;
            text-decoration: none;
            padding: 10px 15px;
            font-size: 10px;
            border: 2px solid #555;
            transition: background 0.2s;
        }

        .btn-back:hover { background-color: #555; }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        .illustration-box {
            background-color: var(--mc-card-bg);
            border: 2px solid var(--mc-card-border);
            border-radius: 4px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 450px;
            text-align: center;
        }

        .full-img-slot {
            width: 100%;
            height: 360px;
            background-color: #151515;
            border: 2px dashed #444;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
            overflow: hidden;
        }

        .details-box {
            background-color: var(--mc-card-bg);
            border: 2px solid var(--mc-card-border);
            padding: 20px;
        }

        .pattern-tag {
            font-size: 9px;
            color: var(--mc-accent);
            margin-bottom: 15px;
            display: block;
        }

        .set-title {
            font-size: 16px;
            margin-bottom: 20px;
            color: #fff;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .item-row {
            background: #151515;
            border-left: 4px solid var(--mc-accent);
            padding: 12px;
            font-size: 9px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .item-enchant {
            color: var(--mc-enchant);
            font-size: 7px;
            text-shadow: 0 0 5px rgba(170, 0, 170, 0.6);
        }

        .item-type { color: #888; font-size: 8px; }
        .error-msg { color: #ff5555; font-size: 9px; line-height: 1.6; }
        .material-select { background: #151515; color: white; border: 2px solid #555; padding: 12px; font: inherit; font-size: 10px; margin-bottom: 15px; max-width: 100%; }
        button { font-family: inherit; cursor: pointer; line-height: 1.6; }
        button:disabled { opacity: .6; cursor: wait; }
        .pattern-description { color: #aaa; font-size: 9px; line-height: 1.9; margin: 10px 0 24px; }
        .item-meta { color: #aaa; font-size: 8px; line-height: 1.8; }
        .item-row { gap: 12px; }
        .item-info { min-width: 0; overflow-wrap: anywhere; }
        .header { gap: 16px; flex-wrap: wrap; line-height: 1.8; }
        :focus-visible { outline: 2px solid var(--mc-accent); outline-offset: 4px; }
        @media (max-width: 480px) { .details-box { padding: 15px; } .set-title { font-size: 13px; } }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="btn-back">&lt; BACK TO CATALOG</a>
        <div style="font-size: 12px; color: var(--mc-accent);">FACTORY METHOD</div>
    </div>

    <div class="container">
        <div class="illustration-box">
            <div style="font-size: 11px; color: #aaa;">SWORD / AXE / PICKAXE</div>
            <div class="full-img-slot">
                <svg width="200" height="200" viewBox="0 0 100 100" role="img" aria-label="Sword, axe and pickaxe" xmlns="http://www.w3.org/2000/svg">
                    <path d="M24 12 H72 V20 H80 V44 H68 V30 H54 V22 H24 Z" fill="var(--mc-accent)" stroke="#66513a" stroke-width="3"/>
                    <path d="M52 28 L62 38 L23 83 L13 73 Z" fill="#80572f" stroke="#49331e" stroke-width="3"/>
                    <path d="M5 8 H13 V43 L9 49 L5 43 Z M1 49 H17 V54 H1 Z M6 54 H12 V70 H6 Z" fill="var(--mc-accent)" stroke="#66513a" stroke-width="2"/>
                    <path d="M80 55 H96 V75 H85 V63 H80 Z" fill="var(--mc-accent)" stroke="#66513a" stroke-width="2"/>
                    <path d="M79 58 H84 V94 H79 Z" fill="#80572f" stroke="#49331e" stroke-width="2"/>
                </svg>
            </div>
        </div>

        <div class="details-box">
            <span class="pattern-tag">DESIGN PATTERN: FACTORY METHOD</span>
            <label for="material" class="pattern-tag">MATERIAL</label>
            <select id="material" class="material-select"><option value="wood">WOOD</option><option value="stone">STONE</option></select>
            <button type="button" id="craftButton" class="btn-back">CRAFT TOOLS</button>
            <p class="pattern-description">Choose wood or stone to craft a sword, axe and pickaxe using its tool factory.</p>
            <div class="set-title">CRAFTED ITEMS</div>
            <div class="items-list" id="itemsList" role="status" aria-live="polite"></div>
        </div>
    </div>

    <script>
        const material = document.getElementById('material');
        const button = document.getElementById('craftButton');
        const list = document.getElementById('itemsList');

        async function craftTool() {
            button.disabled = true;
            list.textContent = 'CRAFTING...';
            try {
                const apiBase = location.protocol === 'file:' ? 'http://localhost:8080' : '';
                const response = await fetch(`${apiBase}/api/equipment/factorymethod?material=${encodeURIComponent(material.value)}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const items = await response.json();
                if (!Array.isArray(items) || items.length === 0) throw new Error('No items returned');
                list.replaceChildren();
                for (const item of items) {
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    const info = document.createElement('div');
                    info.className = 'item-info';
                    const name = document.createElement('div');
                    name.textContent = item.name;
                    const enchantment = document.createElement('div');
                    enchantment.className = 'item-enchant';
                    enchantment.textContent = item.enchantment ? `✨ ${item.enchantment}` : '';
                    const meta = document.createElement('div');
                    meta.className = 'item-meta';
                    meta.textContent = `DURABILITY: ${item.durability} | COST: ${item.resourceCost}`;
                    const type = document.createElement('div');
                    type.className = 'item-type';
                    type.textContent = item.type;
                    info.append(name, enchantment, meta);
                    row.append(info, type);
                    list.append(row);
                }
            } catch (error) {
                const message = document.createElement('div');
                message.className = 'error-msg';
                message.textContent = 'COULD NOT LOAD ITEMS. Check the backend and try CRAFT TOOLS again. Start the server: ./mvnw spring-boot:run';
                list.replaceChildren(message);
            } finally {
                button.disabled = false;
            }
        }
        button.addEventListener('click', craftTool);
        craftTool();
    </script>
</body>
</html>
