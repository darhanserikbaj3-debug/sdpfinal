<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netherite Equipment Set - Strategy Pattern</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --mc-font: 'Press Start 2P', monospace;
            --mc-bg: #121212;
            --mc-card-bg: #1f1f1f;
            --mc-card-border: #333333;
            --mc-netherite: #ff5555;
            --mc-enchant: #aa00aa; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--mc-bg);
            color: #fff;
            font-family: var(--mc-font);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto 30px auto;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
        }

        .btn-back {
            background-color: #333;
            color: #fff;
            text-decoration: none;
            padding: 10px 15px;
            font-size: 10px;
            border: 2px solid #555;
            transition: background 0.2s;
        }

        .btn-back:hover { background-color: #555; }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        .illustration-box {
            background-color: var(--mc-card-bg);
            border: 2px solid var(--mc-card-border);
            border-radius: 4px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 450px;
            text-align: center;
        }

        .full-img-slot {
            width: 100%;
            height: 360px;
            background-color: #151515;
            border: 2px dashed #444;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
            overflow: hidden;
        }

        .full-img-slot img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .placeholder-text {
            font-size: 10px;
            color: #666;
            line-height: 1.8;
        }

        .details-box {
            background-color: var(--mc-card-bg);
            border: 2px solid var(--mc-card-border);
            padding: 20px;
        }

        .pattern-tag {
            font-size: 9px;
            color: var(--mc-netherite);
            margin-bottom: 15px;
            display: block;
        }

        .set-title {
            font-size: 16px;
            margin-bottom: 20px;
            color: #fff;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .item-row {
            background: #151515;
            border-left: 4px solid var(--mc-netherite);
            padding: 12px;
            font-size: 9px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .item-enchant {
            color: var(--mc-enchant);
            font-size: 7px;
            text-shadow: 0 0 5px rgba(170, 0, 170, 0.6);
        }

        .item-type { color: #888; font-size: 8px; }
        .error-msg { color: #ff5555; font-size: 9px; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="btn-back">&lt; BACK TO CATALOG</a>
        <div style="font-size: 12px; color: var(--mc-netherite);">NETHERITE SET</div>
    </div>

    <div class="container">
        <div class="illustration-box">
            <div style="font-size: 11px; color: #aaa;">FULL EQUIPMENT SET</div>
            <div class="full-img-slot">
                <img src="netherite_full_set.png" alt="Netherite Full Set" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <svg width="120" height="160" viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
                    <path d="M30 10 H70 V30 H60 V40 H40 V30 H30 Z" fill="#4a3b40" stroke="#2b2024" stroke-width="2"/>
                    <path d="M20 45 H80 V80 H65 V90 H35 V80 H20 Z" fill="#4a3b40" stroke="#2b2024" stroke-width="2"/>
                    <path d="M30 92 H70 V125 H55 V105 H45 V125 H30 Z" fill="#4a3b40" stroke="#2b2024" stroke-width="2"/>
                    <path d="M25 110 H40 V128 H20 V120 Z M60 110 H75 V120 H80 V128 H60 Z" fill="#4a3b40" stroke="#2b2024" stroke-width="2"/>
                </svg>
            </div>
        </div>

        <!-- Детали и динамический список с сервера -->
        <div class="details-box">
            <span class="pattern-tag">DESIGN PATTERN: STRATEGY</span>
            <div class="set-title">CRAFTED ITEMS</div>
            <div class="items-list" id="itemsList">
                <div class="placeholder-text">CONNECTING TO BACKEND...</div>
            </div>
        </div>
    </div>

    <script>
        async function loadNetheriteSet() {
            const listContainer = document.getElementById('itemsList');
            try {
                const response = await fetch('http://localhost:8080/api/equipment/netherite');
                if (!response.ok) throw new Error('Backend HTTP error');
                
                const items = await response.json();
                listContainer.innerHTML = '';
                
                items.forEach(item => {
                    const enchantText = item.enchantment ? `✨ ${item.enchantment}` : '';
                    listContainer.innerHTML += `
                        <div class="item-row">
                            <div class="item-info">
                                <div>${item.name}</div>
                                <div class="item-enchant">${enchantText}</div>
                            </div>
                            <div class="item-type">${item.type}</div>
                        </div>
                    `;
                });
            } catch (err) {
                listContainer.innerHTML = `
                    <div class="error-msg">
                        SERVER IS OFFLINE.<br><br>
                        Please start the Spring Boot backend to view items:<br>
                        <strong>./mvnw spring-boot:run</strong>
                    </div>
                `;
            }
        }
        loadNetheriteSet();
    </script>
</body>
</html>
